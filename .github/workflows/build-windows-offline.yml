name: Compilar instalador autonomo v7.2.7
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-windows-offline.yml'
      - 'scripts/extract_and_patch.py'
      - 'scripts/patch_plot_727.py'
      - 'scripts/source_patch.txt'
      - 'installer/AutomaticCADaPDF.iss'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Descargar archivos del proyecto
        uses: actions/checkout@v4
      - name: Preparar Python 3.12 para compilar
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Descargar instalador anterior para recuperar el motor
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v7.2.2 --repo $env:GITHUB_REPOSITORY --pattern 'Setup_Automatic_CAD_a_PDF_Converter_v7_2_2.exe' --dir . --clobber
          if (-not (Test-Path 'Setup_Automatic_CAD_a_PDF_Converter_v7_2_2.exe')) { throw 'Falta instalador base' }
      - name: Recuperar funciones corregidas y validar codigo
        shell: pwsh
        run: |
          python scripts/extract_and_patch.py --installer Setup_Automatic_CAD_a_PDF_Converter_v7_2_2.exe --out app-src
          if ($LASTEXITCODE -ne 0) { throw 'Fallo el parche de codigo' }
          python scripts/patch_plot_727.py app-src/automatic_cad_to_pdf.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló el parche de impresión' }
          python -m compileall -q app-src
      - name: Instalar dependencias para compilacion
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "pyinstaller>=6.10,<7" pywin32 pypdf pillow ezdxf pymupdf
          python -c "import tkinter,pythoncom,win32com.client,pypdf,PIL,ezdxf,fitz;print('Bibliotecas OK')"
      - name: Empaquetar Python y bibliotecas dentro del ejecutable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Automatic CAD a PDF Converter" --icon "app-src/galleta.ico" --paths app-src --hidden-import pythoncom --hidden-import pywintypes --hidden-import win32timezone --hidden-import win32com.client --hidden-import update_manager --hidden-import dxfless_renderer --collect-submodules win32com --collect-all ezdxf --collect-all pymupdf --add-data "app-src/galleta.png;." --add-data "app-src/galleta_ui.png;." --add-data "app-src/galleta.ico;." app-src/automatic_cad_to_pdf.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller fallo' }
          $base = 'dist/Automatic CAD a PDF Converter'
          if (-not (Test-Path "$base/Automatic CAD a PDF Converter.exe")) { throw 'Falta EXE' }
          $dlls = @(Get-ChildItem $base -Filter python312.dll -Recurse -ErrorAction SilentlyContinue)
          if ($dlls.Count -lt 1) { throw 'Python no quedo integrado' }
          Copy-Item app-src/AutomaticCadUpdateHelper.exe $base
          Copy-Item app-src/galleta.ico $base
      - name: Preparar Inno Setup
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $compiler)) { throw 'Falta Inno Setup' }
      - name: Crear instalador Windows sin descargas de Python
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer/AutomaticCADaPDF.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup fallo' }
          $setup = 'out/Setup_Automatic_CAD_a_PDF_Converter_v7_2_6.exe'
          if (-not (Test-Path $setup)) { throw 'Falta instalador final' }
          $size = (Get-Item $setup).Length
          if ($size -lt 10000000) { throw 'El instalador es demasiado pequeno' }
          Get-FileHash $setup -Algorithm SHA256 | Format-List
      - name: Publicar archivo instalador en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Automatic_CAD_a_PDF_Converter_v7_2_6_Offline
          path: out/Setup_Automatic_CAD_a_PDF_Converter_v7_2_6.exe
          if-no-files-found: error
          retention-days: 30

name: Compilar prueba DXF v7.2.10 (corrección vaciar)
on:
  push:
    paths:
      - '.github/workflows/build-stable-7210.yml'
      - 'scripts/patch_stable_7210.py'
      - 'scripts/patch_stable_729.py'
      - 'scripts/pdf_safety_729.py'
      - 'installer/AutomaticCADaPDF_7210_TEST.iss'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Recuperar código de la versión estable 7.2.7
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v7.2.2 --repo "$env:GITHUB_REPOSITORY" --pattern Setup_Automatic_CAD_a_PDF_Converter_v7_2_2.exe --dir . --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Falta instalador base verificado' }
          python scripts/extract_and_patch.py --installer Setup_Automatic_CAD_a_PDF_Converter_v7_2_2.exe --out app-src
          if ($LASTEXITCODE -ne 0) { throw 'Extracción verificada falló' }
          python scripts/patch_plot_727.py app-src/automatic_cad_to_pdf.py
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo reconstruir v7.2.7' }
      - name: Aplicar cambios de borrado y PDF sin mezclar beta DWG
        shell: pwsh
        run: |
          Copy-Item scripts/pdf_safety_729.py app-src/pdf_safety.py
          python scripts/patch_stable_729.py app-src
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo reconstruir la base v7.2.10' }
          python scripts/patch_stable_7210.py app-src/automatic_cad_to_pdf.py
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo aplicar la corrección de lista v7.2.10' }
          python -m compileall -q app-src
          if ($LASTEXITCODE -ne 0) { throw 'Error de sintaxis del programa' }
          python -c "import pathlib; s=pathlib.Path('app-src/automatic_cad_to_pdf.py').read_text(encoding='utf-8'); assert ('VERSION = '+chr(34)+'7.2.10'+chr(34)) in s; assert 'Vaciar lista' in s; assert 'dwg_bridge' not in s; print('Base DXF estable verificada')"
          if ($LASTEXITCODE -ne 0) { throw 'Código base no coincide' }
          $env:PYTHONPATH=(Resolve-Path 'app-src').Path
          python -c "from unittest.mock import Mock,patch; import automatic_cad_to_pdf as m; u=Mock(); u.busy=False; u.generacion_proyecto=0; u.archivos=['old.dxf']; u.marcos=[m.Marco('old.dxf',0,0,420,297)]; u.preview_data={};u.preview_pending=set();u.mapa_miniaturas={};u.mapa_fotos={};u.mapa_image_refs=[];u.mapa_rectangulos={}; p=patch.object(m.messagebox,'askyesno',return_value=True);p.start();m.GUI.vaciar_laminas(u);p.stop();assert not u.archivos and not u.marcos and u.generacion_proyecto==1;print('Prueba vaciar sesión: OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Falló la prueba de vaciado y limpieza de DXF' }
      - name: Preparar dependencias Windows y verificar sobrescritura de PDF
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "pyinstaller>=6.10,<7" pywin32 pypdf pillow ezdxf pymupdf
          if ($LASTEXITCODE -ne 0) { throw 'Faltan dependencias Windows' }
          $env:PYTHONPATH = (Resolve-Path 'app-src').Path
          python -c "import tempfile,pathlib; from pypdf import PdfWriter,PdfReader; from pdf_safety import publicar_pdf_atomico; d=pathlib.Path(tempfile.mkdtemp()); out=d/'final.pdf'; out.write_bytes(b'OLD'); p=d/'temp.pdf'; w=PdfWriter(); w.add_blank_page(width=595,height=842); w.write(str(p)); w.close(); publicar_pdf_atomico(p,out,1); assert len(PdfReader(str(out)).pages)==1; print('Sobrescritura segura: OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Falló prueba de PDF en Windows' }
      - name: Compilar ejecutable con Python incluido
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Automatic CAD a PDF Converter" --icon "app-src/galleta.ico" --paths app-src --hidden-import pythoncom --hidden-import pywintypes --hidden-import win32timezone --hidden-import win32com.client --hidden-import update_manager --hidden-import dxfless_renderer --hidden-import pdf_safety --collect-submodules win32com --collect-all ezdxf --collect-all pymupdf --add-data "app-src/galleta.png;." --add-data "app-src/galleta_ui.png;." --add-data "app-src/galleta.ico;." app-src/automatic_cad_to_pdf.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller falló' }
          $dir='dist/Automatic CAD a PDF Converter'
          if (-not (Test-Path "$dir/Automatic CAD a PDF Converter.exe")) { throw 'EXE ausente' }
          if (-not (Get-ChildItem $dir -Filter python312.dll -Recurse -ErrorAction SilentlyContinue)) { throw 'Python integrado ausente' }
          Copy-Item app-src/galleta.ico $dir
          Copy-Item app-src/AutomaticCadUpdateHelper.exe $dir
      - name: Generar instalador de prueba independiente
        shell: pwsh
        run: |
          $compiler='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $compiler)) { throw 'No se encontró Inno Setup' }
          & $compiler 'installer/AutomaticCADaPDF_7210_TEST.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup falló' }
          $exe='out/Setup_Automatic_CAD_a_PDF_Converter_v7_2_10_PRUEBA.exe'
          if (-not (Test-Path $exe)) { throw 'No se generó el instalador' }
          if ((Get-Item $exe).Length -lt 10000000) { throw 'Instalador incompleto' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
      - name: Adjuntar instalador sin publicar Release
        uses: actions/upload-artifact@v4
        with:
          name: Automatic_CAD_a_PDF_Converter_v7_2_10_PRUEBA
          path: out/Setup_Automatic_CAD_a_PDF_Converter_v7_2_10_PRUEBA.exe
          if-no-files-found: error
          retention-days: 30

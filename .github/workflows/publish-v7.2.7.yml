name: Publicar versión validada 7.2.7

on:
  push:
    paths:
      - '.github/workflows/publish-v7.2.7.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Descargar documentación del repositorio
        uses: actions/checkout@v4
      - name: Recuperar exactamente el instalador probado
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path release-dist -Force | Out-Null
          gh run download 40766763396 --repo "$env:GITHUB_REPOSITORY" --name Automatic_CAD_a_PDF_Converter_v7_2_6_Offline --dir release-dist
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar la compilación previamente probada' }
          $old = 'release-dist/Setup_Automatic_CAD_a_PDF_Converter_v7_2_6.exe'
          if (-not (Test-Path $old)) { throw 'No se encontró el ejecutable de la compilación probada' }
          Rename-Item $old 'Setup_Automatic_CAD_a_PDF_Converter_v7_2_7.exe'
          $exe = 'release-dist/Setup_Automatic_CAD_a_PDF_Converter_v7_2_7.exe'
          $sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '09d0ab449d5e16926ef85e55d7fd6720f9256828c859d39be043abf9d9e475c6'
          if ($sha256 -ne $expected) { throw "HASH INCORRECTO: $sha256" }
          $size = (Get-Item $exe).Length
          if ($size -lt 90000000) { throw "Instalador demasiado pequeño: $size" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "No es un archivo EXE válido" }
          Write-Host "Comprobado: $size bytes SHA-256 $sha256"

      - name: Publicar GitHub Release estable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exists = gh release view v7.2.7 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "La release v7.2.7 ya existe; no se sobrescribirá." }
          gh release create v7.2.7 'release-dist/Setup_Automatic_CAD_a_PDF_Converter_v7_2_7.exe' --repo "$env:GITHUB_REPOSITORY" --target main --title 'Automatic CAD a PDF Converter v7.2.7' --notes-file 'docs/NOTAS_V7_2_7.md' --latest
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar la versión v7.2.7" }
          $item = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($item.tag_name -ne 'v7.2.7' -or $item.draft -or $item.prerelease) { throw 'La versión pública no está estable' }
          if ($item.assets.Count -ne 1 -or $item.assets[0].name -ne 'Setup_Automatic_CAD_a_PDF_Converter_v7_2_7.exe') { throw 'El asset de la publicación es incorrecto' }
          if ($item.assets[0].digest -ne 'sha256:09d0ab449d5e16926ef85e55d7fd6720f9256828c859d39be043abf9d9e475c6') { throw 'El hash del archivo publicado es diferente' }
          Write-Host "Publicación verificada: $($item.html_url)"

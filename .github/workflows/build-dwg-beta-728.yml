name: Compilar Beta DWG v7.2.8 (sin publicar)

on:
  push:
    branches:
      - 'develop/v7.2.8-security'
    paths:
      - '.github/workflows/build-dwg-beta-728.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Obtener código de la rama beta
        uses: actions/checkout@v4

      - name: Preparar Python 3.12 solamente en el compilador
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Recuperar recursos originales verificados
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v7.2.2 --repo "$env:GITHUB_REPOSITORY" --pattern 'Setup_Automatic_CAD_a_PDF_Converter_v7_2_2.exe' --dir . --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Faltó instalador original para extraer recursos' }
          python scripts/extract_and_patch.py --installer Setup_Automatic_CAD_a_PDF_Converter_v7_2_2.exe --out app-src
          if ($LASTEXITCODE -ne 0) { throw 'Recursos base no superaron verificación' }

      - name: Aplicar fuentes de la beta DWG y verificar integridad
        shell: pwsh
        run: |
          $src='dev_source/v7_2_8_dwg_beta_sources.b64'
          $out='beta-728.zip'
          [IO.File]::WriteAllBytes((Join-Path $PWD $out),[Convert]::FromBase64String((Get-Content $src -Raw).Trim()))
          $actual=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected='d061ac49d8d5b6b4b896235e8dee175539fc1fa97615a2d2a093e026f6b26880'
          if ($actual -ne $expected) { throw "Fuentes beta corruptas: $actual" }
          Expand-Archive -Path $out -DestinationPath app-src -Force
          python -m compileall -q app-src
          if ($LASTEXITCODE -ne 0) { throw 'Falló validación de sintaxis' }
          python -c "from pathlib import Path; a=Path('app-src/automatic_cad_to_pdf.py').read_text(encoding='utf-8'); assert '7.2.8' in a; assert 'Agregar DWG/DXF' in a; print('Codigo beta DWG verificado')"
          if ($LASTEXITCODE -ne 0) { throw 'No es la beta DWG correcta' }

      - name: Instalar dependencias en el compilador
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "pyinstaller>=6.10,<7" pywin32 pypdf pillow ezdxf pymupdf pytest
          if ($LASTEXITCODE -ne 0) { throw 'Falló la preparación de dependencias' }

      - name: Probar funcionalidad beta DWG
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path app-src).Path
          python -m pytest app-src/tests -q
          if ($LASTEXITCODE -ne 0) { throw 'La beta DWG no pasó sus pruebas de regresión' }

      - name: Compilar EXE autónomo con Python integrado
        shell: pwsh
        run: |
          Push-Location app-src
          try {
            python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Automatic CAD a PDF Converter" --icon "galleta.ico" --paths . --hidden-import pythoncom --hidden-import pywintypes --hidden-import win32timezone --hidden-import win32com.client --hidden-import update_manager --hidden-import dwg_bridge --hidden-import dwg_blocks --hidden-import cad_safety --hidden-import dxfless_renderer --collect-submodules win32com --collect-all ezdxf --collect-all pymupdf --add-data "galleta.png;." --add-data "galleta_ui.png;." --add-data "galleta.ico;." automatic_cad_to_pdf.py
            if ($LASTEXITCODE -ne 0) { throw 'PyInstaller falló' }
            $base = 'dist/Automatic CAD a PDF Converter'
            if (-not (Test-Path "$base/Automatic CAD a PDF Converter.exe")) { throw 'Falta el EXE de la beta' }
            $runtime=@(Get-ChildItem $base -Filter python312.dll -Recurse -ErrorAction SilentlyContinue)
            if ($runtime.Count -lt 1) { throw 'No se integró Python 3.12' }
            Copy-Item AutomaticCadUpdateHelper.exe $base -Force
            Copy-Item galleta.ico $base -Force
          } finally {
            Pop-Location
          }

      - name: Compilar instalador EXE beta separado
        shell: pwsh
        run: |
          $compiler='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $compiler)) { throw 'No se encuentra Inno Setup' }
          & $compiler 'app-src/compilacion/AutomaticCadPDF_BetaDWG.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Falló el instalador Inno Setup' }
          $setup='app-src/out/Setup_Automatic_CAD_a_PDF_Converter_v7_2_8_BETA_DWG.exe'
          if (-not (Test-Path $setup)) { throw 'El instalador beta no fue creado' }
          if ((Get-Item $setup).Length -lt 10000000) { throw 'Instalador incompleto' }
          $m=(Get-Content $setup -AsByteStream -TotalCount 2)
          if ($m[0] -ne 77 -or $m[1] -ne 90) { throw 'El archivo no es un EXE de Windows' }
          Get-FileHash $setup -Algorithm SHA256 | Format-List

      - name: Adjuntar instalador SOLO como artefacto de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Automatic_CAD_a_PDF_Converter_v7_2_8_BETA_DWG_instalador
          path: app-src/out/Setup_Automatic_CAD_a_PDF_Converter_v7_2_8_BETA_DWG.exe
          if-no-files-found: error
          retention-days: 30
